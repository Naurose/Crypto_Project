<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GameVault</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🎮</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/landing.css">
</head>
<body>
    <nav class="navbar glass">
        <a href="index.html" class="logo">GameVault</a>
        <div class="nav-actions">
            <div id="authLinks" style="display: inline-flex; gap: 2.5rem;"></div>
        </div>
    </nav>

    <div style="margin-top: 120px;">
        <div class="auth-container">
            <!-- STEP 1: Registration Form -->
            <div id="registerStep">
                <h2 class="section-title" style="text-align: center; margin-bottom: 2rem;">Create Account</h2>
                <form id="registerForm" onsubmit="return false;">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="choose a username" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="your.name@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="address" placeholder="optional address">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="phone" placeholder="optional phone number">
                    </div>
                    <button type="button" id="btnRegisterSubmit" onclick="handleRegisterSubmit(event)" class="btn btn-primary btn-large" style="width: 100%; margin-top: 1rem;">Send Verification Code</button>
                    <p style="text-align: center; margin-top: 1.5rem; color: #888;">
                        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Login</a>
                    </p>
                </form>
            </div>

            <!-- STEP 2: OTP Verification Container -->
            <div id="otpStep" style="display: none;" class="otp-container">
                <h2 class="section-title" style="text-align: center; margin-bottom: 0.5rem;">Verify Your Email</h2>
                <p class="otp-info-msg">We sent a 6-digit confirmation code to</p>
                <div class="otp-email-badge" id="otpTargetEmail">user@example.com</div>

                <form id="otpForm" onsubmit="return false;">
                    <div class="otp-inputs" id="registerOtpGrid">
                        <input type="text" maxlength="1" class="otp-box" data-index="0" autocomplete="off" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-box" data-index="1" autocomplete="off" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-box" data-index="2" autocomplete="off" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-box" data-index="3" autocomplete="off" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-box" data-index="4" autocomplete="off" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-box" data-index="5" autocomplete="off" inputmode="numeric">
                    </div>

                    <button type="button" id="btnVerifyRegisterOtp" onclick="handleVerifyRegisterOtp()" class="btn btn-primary btn-large" style="width: 100%; margin-top: 1rem;">Verify & Create Account</button>
                </form>

                <div class="otp-timer-container">
                    <span id="resendTimerText">Resend code in <span class="otp-timer" id="timerCount">60</span>s</span>
                    <button type="button" id="btnResendOtp" class="btn-resend" style="display: none;" onclick="handleResendRegisterOtp(event)">Resend Code</button>
                </div>

                <div>
                    <span class="otp-back-link" onclick="showRegisterStep()">← Edit Details</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js?v=5"></script>
    <script>
        let pendingUserData = null;

        // Allow Enter key to trigger submission without native form reload
        document.getElementById('registerForm').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleRegisterSubmit(e);
            }
        });

        document.getElementById('otpForm').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleVerifyRegisterOtp();
            }
        });

        async function handleRegisterSubmit(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const address = document.getElementById('address').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (!username || !email || !password) {
                showToast('Please fill in username, email, and password.');
                return;
            }

            const btn = document.getElementById('btnRegisterSubmit');
            btn.disabled = true;
            btn.textContent = 'Sending OTP...';

            pendingUserData = { username, email, password, address, phone };

            try {
                const res = await api.registerRequest(pendingUserData);
                btn.disabled = false;
                btn.textContent = 'Send Verification Code';

                if (res.requiresOtp || res.success) {
                    document.getElementById('otpTargetEmail').textContent = pendingUserData.email;
                    showOtpStep();
                    setupOtpInputGrid('registerOtpGrid', handleVerifyRegisterOtp);
                    startResendTimer();
                    showToast(res.message || 'OTP verification code sent to your email.');
                } else {
                    showToast(res.message || 'Registration request failed');
                }
            } catch (err) {
                console.error('Registration error:', err);
                btn.disabled = false;
                btn.textContent = 'Send Verification Code';
                showToast('Error connecting to server.');
            }
        }

        function showOtpStep() {
            document.getElementById('registerStep').style.display = 'none';
            document.getElementById('otpStep').style.display = 'block';
            clearOtpGrid('registerOtpGrid');
        }

        function showRegisterStep() {
            document.getElementById('otpStep').style.display = 'none';
            document.getElementById('registerStep').style.display = 'block';
            stopResendTimer();
        }

        async function handleVerifyRegisterOtp() {
            const otpCode = getOtpValue('registerOtpGrid');
            if (otpCode.length !== 6) {
                showToast('Please enter the full 6-digit code');
                return;
            }

            const btn = document.getElementById('btnVerifyRegisterOtp');
            btn.disabled = true;
            btn.textContent = 'Creating Account...';

            try {
                const verifyPayload = {
                    ...pendingUserData,
                    otp: otpCode
                };
                const res = await api.registerVerify(verifyPayload);
                btn.disabled = false;
                btn.textContent = 'Verify & Create Account';

                if (res.token) {
                    showToast('Account Created & Verified!');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                } else {
                    showToast(res.message || 'Registration verification failed.');
                }
            } catch (err) {
                console.error('Verify error:', err);
                btn.disabled = false;
                btn.textContent = 'Verify & Create Account';
                showToast('Server error during registration verification.');
            }
        }

        async function handleResendRegisterOtp(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            if (!pendingUserData || !pendingUserData.email) return;
            const res = await api.resendOtp(pendingUserData.email, 'register');
            showToast(res.message);
            if (res.success) {
                startResendTimer();
            }
        }
    </script>
</body>
</html>
