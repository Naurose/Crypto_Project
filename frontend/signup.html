<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - GameVault</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🎮</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/landing.css">
    <style>
        .otp-badge {
            display: inline-block;
            background: rgba(0, 242, 234, 0.12);
            border: 1px solid rgba(0, 242, 234, 0.4);
            color: #00F2EA;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0.8rem 0 1.5rem 0;
            word-break: break-all;
        }
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin: 1.5rem 0;
        }
        .otp-box {
            width: 48px !important;
            height: 56px !important;
            text-align: center !important;
            font-size: 1.6rem !important;
            font-weight: 800 !important;
            color: #fff !important;
            background: rgba(0, 0, 0, 0.5) !important;
            border: 2px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 12px !important;
            padding: 0 !important;
            box-sizing: border-box !important;
            transition: all 0.2s ease !important;
        }
        .otp-box:focus {
            outline: none !important;
            border-color: #00F2EA !important;
            box-shadow: 0 0 16px rgba(0, 242, 234, 0.4) !important;
            background: rgba(0, 242, 234, 0.08) !important;
        }
        .otp-box.filled {
            border-color: #6366f1 !important;
            background: rgba(99, 102, 241, 0.15) !important;
        }
        .btn-resend {
            background: none;
            border: none;
            color: #00F2EA;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.95rem;
        }
        .back-link {
            color: #888;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-block;
            margin-top: 1rem;
            text-decoration: none;
        }
        .back-link:hover {
            color: #fff;
        }
        .error-msg {
            color: #ff4757;
            font-size: 0.9rem;
            margin: 0.5rem 0;
            font-weight: 600;
            min-height: 1.2rem;
        }
    </style>
</head>
<body>
    <nav class="navbar glass">
        <a href="index.html" class="logo">GameVault</a>
        <div class="nav-actions">
            <div id="authLinks" style="display: inline-flex; gap: 2.5rem;"></div>
        </div>
    </nav>

    <div style="margin-top: 120px;">
        <div class="auth-container">

            <!-- STEP 1: Registration Form -->
            <div id="stepRegister">
                <h2 class="section-title" style="text-align: center; margin-bottom: 2rem;">Create Account</h2>
                
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="choose a username" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="your.name@example.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" placeholder="optional address">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone" placeholder="optional phone number">
                </div>

                <div id="registerError" class="error-msg"></div>

                <button type="button" id="btnSendCode" onclick="handleSendCode()" class="btn btn-primary btn-large" style="width: 100%; margin-top: 0.5rem;">
                    SEND VERIFICATION CODE
                </button>

                <p style="text-align: center; margin-top: 1.5rem; color: #888;">
                    Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Login</a>
                </p>
            </div>

            <!-- STEP 2: OTP Verification Box (Revealed directly inside the card) -->
            <div id="stepOtp" style="display: none; text-align: center;">
                <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔐</div>
                <h2 class="section-title" style="margin-bottom: 0.5rem;">Verify Your Email</h2>
                <p style="color: #a0a0b0; font-size: 0.95rem; margin-bottom: 0.3rem;">
                    Enter the 6-digit confirmation code sent to:
                </p>
                <div class="otp-badge" id="otpEmailDisplay">user@example.com</div>

                <div class="otp-inputs" id="otpInputs">
                    <input type="text" maxlength="1" class="otp-box" data-idx="0" inputmode="numeric" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-box" data-idx="1" inputmode="numeric" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-box" data-idx="2" inputmode="numeric" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-box" data-idx="3" inputmode="numeric" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-box" data-idx="4" inputmode="numeric" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-box" data-idx="5" inputmode="numeric" autocomplete="off">
                </div>

                <div id="otpError" class="error-msg"></div>

                <button type="button" id="btnVerifyCode" onclick="handleVerifyCode()" class="btn btn-primary btn-large" style="width: 100%; margin-top: 0.5rem;">
                    VERIFY & CREATE ACCOUNT
                </button>

                <div style="margin-top: 1.5rem; font-size: 0.9rem; color: #888;">
                    <span id="timerContainer">Resend code in <strong id="timerSec" style="color: #00F2EA;">60</strong>s</span>
                    <button type="button" id="btnResend" class="btn-resend" style="display: none;" onclick="handleResend()">
                        Resend Code
                    </button>
                </div>

                <div style="margin-top: 1.2rem;">
                    <a href="javascript:void(0)" onclick="handleBackToEdit()" class="back-link">← Edit Details / Change Email</a>
                </div>
            </div>

        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const API_BASE = (typeof API_URL !== 'undefined') ? API_URL : 'http://localhost:5000/api';
        let userFormData = null;
        let resendTimer = null;

        function showMsg(id, text) {
            const el = document.getElementById(id);
            if (el) el.textContent = text || '';
        }

        // 1. Submit Registration -> Send Verification Code
        async function handleSendCode() {
            showMsg('registerError', '');
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const address = document.getElementById('address').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (!username || !email || !password) {
                showMsg('registerError', 'Please fill in username, email, and password.');
                return;
            }

            const btn = document.getElementById('btnSendCode');
            btn.disabled = true;
            btn.textContent = 'SENDING CODE...';

            userFormData = { username, email, password, address, phone };

            try {
                const res = await fetch(API_BASE + '/auth/register-request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userFormData)
                });

                let data = {};
                try { data = await res.json(); } catch(e) {}

                btn.disabled = false;
                btn.textContent = 'SEND VERIFICATION CODE';

                console.log('[signup] status:', res.status, 'data:', data);

                if (res.ok) {
                    // Success — show OTP step
                    document.getElementById('stepRegister').style.display = 'none';
                    document.getElementById('stepOtp').style.display = 'block';
                    document.getElementById('otpEmailDisplay').textContent = email;
                    setupOtpBoxes();
                    startTimer(60);
                } else {
                    // Show the exact server error so the user knows what went wrong
                    showMsg('registerError', data.message || 'Error: ' + res.status);
                }
            } catch (err) {
                console.error('[signup] fetch error:', err);
                btn.disabled = false;
                btn.textContent = 'SEND VERIFICATION CODE';
                showMsg('registerError', 'Cannot connect to server (port 5000). Is the server running?');
            }
        }

        // 2. Setup OTP Input Boxes
        function setupOtpBoxes() {
            const boxes = document.querySelectorAll('#otpInputs .otp-box');
            boxes.forEach((box, i) => {
                box.value = '';
                box.classList.remove('filled');
                box.onfocus = () => box.select();

                box.oninput = () => {
                    if (box.value) {
                        box.classList.add('filled');
                        if (i < boxes.length - 1) {
                            boxes[i + 1].focus();
                        } else if (getOtp().length === 6) {
                            handleVerifyCode();
                        }
                    } else {
                        box.classList.remove('filled');
                    }
                };

                box.onkeydown = (e) => {
                    if (e.key === 'Backspace' && !box.value && i > 0) {
                        boxes[i - 1].focus();
                        boxes[i - 1].value = '';
                        boxes[i - 1].classList.remove('filled');
                    } else if (e.key === 'ArrowLeft' && i > 0) {
                        boxes[i - 1].focus();
                    } else if (e.key === 'ArrowRight' && i < boxes.length - 1) {
                        boxes[i + 1].focus();
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        handleVerifyCode();
                    }
                };

                box.onpaste = (e) => {
                    e.preventDefault();
                    const text = (e.clipboardData || window.clipboardData).getData('text').trim();
                    const nums = text.replace(/\D/g, '').slice(0, 6);
                    if (nums.length > 0) {
                        nums.split('').forEach((digit, idx) => {
                            if (boxes[idx]) {
                                boxes[idx].value = digit;
                                boxes[idx].classList.add('filled');
                            }
                        });
                        const next = Math.min(nums.length, boxes.length - 1);
                        boxes[next].focus();
                        if (nums.length === 6) handleVerifyCode();
                    }
                };
            });

            setTimeout(() => { if (boxes[0]) boxes[0].focus(); }, 100);
        }

        function getOtp() {
            let s = '';
            document.querySelectorAll('#otpInputs .otp-box').forEach(b => s += b.value.trim());
            return s;
        }

        // 3. Verify OTP & Finalize Registration
        async function handleVerifyCode() {
            showMsg('otpError', '');
            const code = getOtp();
            if (code.length !== 6) {
                showMsg('otpError', 'Please enter the full 6-digit code.');
                return;
            }

            const btn = document.getElementById('btnVerifyCode');
            btn.disabled = true;
            btn.textContent = 'VERIFYING...';

            try {
                const res = await fetch(API_BASE + '/auth/register-verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...userFormData, otp: code })
                });
                const data = await res.json();
                btn.disabled = false;
                btn.textContent = 'VERIFY & CREATE ACCOUNT';

                if (res.ok && data.token) {
                    localStorage.setItem('token', data.token);
                    if (data.user) localStorage.setItem('user', JSON.stringify(data.user));
                    showMsg('otpError', '');
                    document.getElementById('stepOtp').innerHTML = '<div style="font-size: 3rem; margin-bottom: 1rem;">🎉</div><h2 class="section-title" style="color: #00F2EA;">Account Verified!</h2><p style="color: #cbd5e1; margin-top: 1rem;">Redirecting to GameVault...</p>';
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                } else {
                    showMsg('otpError', data.message || 'Invalid or expired OTP code.');
                }
            } catch (err) {
                console.error(err);
                btn.disabled = false;
                btn.textContent = 'VERIFY & CREATE ACCOUNT';
                showMsg('otpError', 'Server connection error during verification.');
            }
        }

        // 4. Resend OTP Code
        async function handleResend() {
            if (!userFormData || !userFormData.email) return;
            const resendBtn = document.getElementById('btnResend');
            resendBtn.disabled = true;
            resendBtn.textContent = 'Resending...';

            try {
                const res = await fetch(API_BASE + '/auth/resend-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userFormData.email, purpose: 'register' })
                });
                const data = await res.json();
                resendBtn.disabled = false;
                resendBtn.textContent = 'Resend Code';

                if (data.success) {
                    showMsg('otpError', '');
                    startTimer(60);
                    setupOtpBoxes();
                } else {
                    showMsg('otpError', data.message || 'Failed to resend code.');
                }
            } catch (err) {
                resendBtn.disabled = false;
                resendBtn.textContent = 'Resend Code';
                showMsg('otpError', 'Error requesting new code.');
            }
        }

        function handleBackToEdit() {
            if (resendTimer) clearInterval(resendTimer);
            document.getElementById('stepOtp').style.display = 'none';
            document.getElementById('stepRegister').style.display = 'block';
        }

        function startTimer(sec = 60) {
            if (resendTimer) clearInterval(resendTimer);
            let rem = sec;
            const tc = document.getElementById('timerContainer');
            const ts = document.getElementById('timerSec');
            const rb = document.getElementById('btnResend');
            tc.style.display = 'inline';
            rb.style.display = 'none';
            ts.textContent = rem;

            resendTimer = setInterval(() => {
                rem--;
                ts.textContent = rem;
                if (rem <= 0) {
                    clearInterval(resendTimer);
                    tc.style.display = 'none';
                    rb.style.display = 'inline-block';
                }
            }, 1000);
        }
    </script>
</body>
</html>
